<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leserina – Zaubergarten</title>
<style>
@font-face { font-family: 'Andika'; src: url('fonts/andika-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Andika'; src: url('fonts/andika-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
:root {
  --ink: #2c2a1e;
  --leaf: #3f7f36;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --hand: "Noteworthy", "Chalkboard SE", "Marker Felt", "Comic Sans MS", cursive;
}
* { box-sizing: border-box; }
body { margin: 0; background: #22252b; color: #dfe8d6; font-family: "Avenir Next", Avenir, "Helvetica Neue", sans-serif; padding: 26px 0 60px; }
.stack { zoom: var(--s, 1); width: 1180px; margin: 0 auto; }
.page-head { display: flex; align-items: center; gap: 18px; padding: 0 6px; }
.page-head svg { width: 64px; height: 64px; flex: none; }
.page-head h1 { margin: 0; font: 700 50px/1.1 var(--hand); color: #cdeeb0; letter-spacing: .5px; }
.page-head p { margin: 4px 0 0; font-size: 18px; line-height: 1.4; color: #aab6a2; max-width: 70ch; }
.cap { margin: 30px 6px 10px; font: 700 22px/1 var(--hand); color: #b9d6a2; }
.frame { width: 1180px; height: 820px; overflow: hidden; position: relative; border-radius: 18px; background: #e9f5dc; }
.scene { position: absolute; inset: 0; width: 1180px; height: 820px; }
button { font: inherit; border: 0; background: none; padding: 0; cursor: pointer; color: inherit; }

/* scenery motion */
.tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .95; transform: scale(1) rotate(0); } 50% { opacity: .35; transform: scale(.6) rotate(20deg); } }
.flap { transform-box: fill-box; transform-origin: center; animation: flap .7s ease-in-out infinite alternate; }
@keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.55); } }
.float { animation: float 5s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(6px, -8px); } }
.bud { fill: #f6fbef; stroke: #77ab5f; stroke-width: 2.4; stroke-dasharray: 5 4; }

/* top bar */
.home { position: absolute; left: 26px; top: 20px; width: 78px; height: 78px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #ffffff, #f0f8e6 70%);
  box-shadow: 0 0 0 4px #b7dd9b, 0 6px 0 3px #8fc272, 0 12px 18px rgba(60, 100, 40, .25);
  display: grid; place-items: center; }
.home svg { width: 44px; height: 44px; }
.progress { position: absolute; left: 118px; top: 6px; width: 112px; height: 112px; filter: drop-shadow(0 5px 6px rgba(80, 110, 50, .25)); }
.coll { position: absolute; right: 40px; top: 2px; width: 150px; height: 104px; }
.coll svg { width: 150px; height: 104px; filter: drop-shadow(0 5px 6px rgba(80, 90, 40, .25)); }
.badge { position: absolute; right: -22px; top: 44px; min-width: 50px; height: 50px; border-radius: 25px; padding: 0 8px;
  display: grid; place-items: center; font: 700 30px/1 Andika, sans-serif; color: #3a2c0c;
  background: radial-gradient(circle at 40% 35%, #fffdf0, #ffe58a 80%);
  box-shadow: 0 0 0 3px #fff, 0 0 0 5px #e2b23d, 0 6px 10px rgba(90, 70, 20, .3); }

/* picture cards: emoji in an open blossom */
.pic { position: absolute; width: 184px; height: 184px; transform: rotate(var(--r, 0deg)); filter: drop-shadow(0 8px 8px rgba(70, 100, 40, .26)); }
.pic .petals { position: absolute; inset: 0; width: 100%; height: 100%; }
.pic .face { position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%;
  background: radial-gradient(circle at 45% 40%, #ffffff 55%, #fbf8ec);
  box-shadow: 0 0 0 4px rgba(255, 255, 255, .9), 0 0 0 6px rgba(160, 130, 80, .18), inset 0 -4px 8px rgba(150, 130, 80, .12);
  display: grid; place-items: center; }
.emo { font-family: var(--emoji); font-size: 88px; line-height: 1; transform: rotate(calc(var(--r, 0deg) * -1)); }
.pic.sm { position: relative; left: 0; top: 0; width: 100px; height: 100px; flex: none; filter: drop-shadow(0 4px 4px rgba(60, 40, 20, .35)); }
.pic.sm .face { width: 72px; height: 72px; margin: -36px 0 0 -36px; box-shadow: 0 0 0 3px rgba(255, 255, 255, .9); }
.pic.sm .emo { font-size: 48px; }

/* word cards: little wooden garden signs on a stake */
.post { position: absolute; display: flex; flex-direction: column; align-items: center; transform: rotate(var(--r)); transform-origin: 50% 100%; }
.board { position: relative; z-index: 2; font: 400 48px/1 Andika, sans-serif; color: var(--ink); padding: 14px 34px 18px; border-radius: 16px 16px 18px 18px;
  background:
    radial-gradient(circle, #a7774a 0 3.4px, #e8cb98 4.4px, transparent 5.4px) left 11px center / 12px 12px no-repeat,
    radial-gradient(circle, #a7774a 0 3.4px, #e8cb98 4.4px, transparent 5.4px) right 11px center / 12px 12px no-repeat,
    repeating-linear-gradient(177deg, transparent 0 10px, rgba(170, 120, 60, .07) 10px 12px, transparent 12px 19px),
    linear-gradient(#fdf1d8, #f4ddb2);
  border: 3px solid #c99a5e; box-shadow: 0 4px 0 #d3a868, 0 10px 14px rgba(70, 90, 30, .24); }
.stake { position: relative; z-index: 1; width: 16px; height: 50px; margin-top: -4px;
  background: linear-gradient(90deg, #e1bc86, #c49359 70%, #b3824a);
  clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%); }
.tuft { position: relative; z-index: 3; width: 70px; height: 26px; margin-top: -22px; }
.post::after { content: ""; position: absolute; z-index: 0; bottom: 0; left: 50%; width: 70px; height: 12px; margin-left: -35px; border-radius: 50%; background: rgba(80, 120, 50, .22); filter: blur(3px); }
.post.drag { transform: rotate(var(--r)) scale(1.07); transform-origin: 50% 50%; filter: drop-shadow(0 26px 18px rgba(50, 80, 30, .32)); z-index: 5; animation: hover 3s ease-in-out infinite; }
.post.drag::after { display: none; }
.post.drag .board { box-shadow: 0 4px 0 #d3a868, 0 0 0 6px rgba(255, 246, 190, .55); }
.clump { position: absolute; left: -7px; bottom: 2px; width: 30px; height: 14px; border-radius: 50% 50% 45% 45%; background: #8e6a48; opacity: .85; }
@keyframes hover { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
.ghost { position: absolute; width: 130px; height: 24px; border-radius: 50%; background: radial-gradient(rgba(70, 110, 40, .28), transparent 70%); }
.trail { position: absolute; width: 160px; height: 120px; pointer-events: none; }

/* bottom strip: matched pairs resting on a mossy log */
.pair { position: absolute; top: 704px; height: 104px; display: flex; align-items: center; gap: 4px; }
.board.sm { font-size: 34px; padding: 9px 24px 12px; border-radius: 12px; transform: rotate(var(--r)); box-shadow: 0 3px 0 #d3a868, 0 6px 8px rgba(50, 30, 10, .35);
  background:
    radial-gradient(circle, #a7774a 0 2.6px, transparent 3.6px) left 7px center / 9px 9px no-repeat,
    radial-gradient(circle, #a7774a 0 2.6px, transparent 3.6px) right 7px center / 9px 9px no-repeat,
    linear-gradient(#fdf1d8, #f4ddb2); }

/* start */
.title { position: absolute; left: 0; right: 0; top: 52px; margin: 0; text-align: center; font: 700 112px/1 var(--hand); color: #3f7f36; letter-spacing: 1px;
  text-shadow: 0 2px 0 #fff, 0 0 24px rgba(255, 255, 255, .9); }
.kid { position: absolute; top: 300px; width: 250px; display: flex; flex-direction: column; align-items: center; }
.pic.xl { position: relative; width: 250px; height: 250px; --r: 0deg; }
.pic.xl .face { width: 178px; height: 178px; margin: -89px 0 0 -89px; }
.pic.xl .emo { font-size: 118px; }
.kidname { margin-top: 6px; font: 400 44px/1.15 Andika, sans-serif; color: var(--ink); }
.kidcount { display: flex; align-items: center; gap: 6px; margin-top: 4px; font: 700 26px/1 Andika, sans-serif; color: #45573a; padding: 4px 14px 4px 6px; border-radius: 20px; background: rgba(255, 255, 255, .55); }
.kidcount svg { width: 32px; height: 32px; }
.lock { position: absolute; right: 22px; bottom: 20px; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .5); box-shadow: 0 2px 6px rgba(60, 90, 40, .15); }
.lock svg { width: 34px; height: 34px; }

/* reward */
.rays { position: absolute; left: 590px; top: 230px; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255, 252, 225, .55) 0 7deg, rgba(255, 252, 225, 0) 7deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 8%, transparent 60%); mask: radial-gradient(circle, #000 8%, transparent 60%);
  animation: spin 60s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.bigflower { position: absolute; left: 430px; top: 70px; width: 320px; height: 320px; filter: drop-shadow(0 10px 12px rgba(150, 80, 110, .25)); }
.arc { position: absolute; inset: 0; width: 1180px; height: 820px; pointer-events: none; }
.bed { position: absolute; left: 110px; top: 390px; width: 800px; height: 330px; }
.bed svg { width: 800px; height: 330px; filter: drop-shadow(0 10px 10px rgba(80, 90, 40, .25)); }
.badge.big { right: 26px; top: 208px; min-width: 76px; height: 76px; border-radius: 38px; font-size: 46px; }
.newest .tw, .newest { }
.next { position: absolute; left: 940px; top: 520px; width: 150px; height: 150px; border-radius: 50%;
  background: radial-gradient(circle at 40% 32%, #9edc78, #5aaa45 70%, #4d9a3b);
  box-shadow: 0 0 0 7px #fff, 0 0 0 10px #bfe3a6, 0 12px 0 6px #458a35, 0 22px 26px rgba(50, 90, 30, .35);
  display: grid; place-items: center; animation: pulse 2.4s ease-in-out infinite; }
.next svg { width: 76px; height: 76px; margin-left: 8px; }
@keyframes pulse { 0%, 100% { scale: 1; } 50% { scale: 1.04; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>

    <div>
      <h1>Zaubergarten</h1>
      <p>A sunny fairy meadow: pictures sit in open blossoms, words stand on little garden signs, and every finished round grows one more flower in the child's window box.</p>
