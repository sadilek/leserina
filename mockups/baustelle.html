<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leserina – Baustelle</title>
<style>
  @font-face { font-family: 'Andika'; src: url('fonts/andika-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Andika'; src: url('fonts/andika-latin-700-normal.woff2') format('woff2'); font-weight: 700; }

  :root {
    --sky-top: #5cc0ee;
    --sky-low: #c6ecfc;
    --sand: #efd5a0;
    --sand-deep: #e2bd7c;
    --crane: #ffc21a;
    --crane-edge: #d49a00;
    --ink: #2e2b28;
    --brick: #d9583a;
    --steel: #4b525e;
    --pine: #f8e4bb;
    --word: #1f2430;
    --sign-font: 'Futura', 'Avenir Next', 'Trebuchet MS', sans-serif;
    --emoji: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #22252b; }
  body { padding: 26px 16px 60px; color: #e9e6df; font-family: var(--sign-font); }

  .stack { zoom: var(--s, 1); width: 1180px; margin: 0 auto; }

  /* ---------- page heading: a site sign ---------- */
  .page-head { display: flex; align-items: center; gap: 26px; margin: 0 0 30px; }
  .page-head h1 {
    margin: 0; position: relative;
    font: 700 46px/1 var(--sign-font); letter-spacing: .5px; color: var(--ink);
    background: var(--crane); padding: 14px 64px 16px;
    border-radius: 8px; box-shadow: 0 0 0 4px var(--ink), 0 8px 0 4px #0d0f12;
  }
  .page-head h1::before, .page-head h1::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 38px;
    background: repeating-linear-gradient(-45deg, var(--ink) 0 9px, var(--crane) 9px 18px);
  }
  .page-head h1::before { left: 0; border-radius: 8px 0 0 8px; }
  .page-head h1::after { right: 0; border-radius: 0 8px 8px 0; }
  .page-head p { margin: 0; max-width: 640px; font: 400 19px/1.45 'Avenir Next', 'Futura', sans-serif; color: #c9ccd2; }

  .caption { font: 600 22px/1 var(--sign-font); color: #f2d46a; margin: 0 0 12px 4px; display: flex; align-items: center; gap: 10px; }
  .caption::before { content: ''; width: 26px; height: 12px; border-radius: 2px; background: repeating-linear-gradient(-45deg, var(--ink) 0 5px, var(--crane) 5px 10px); box-shadow: 0 0 0 2px var(--crane); }

  .frame {
    width: 1180px; height: 820px; overflow: hidden; position: relative; border-radius: 18px;
    margin-bottom: 28px; background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-low) 26%, var(--sky-low) 100%);
  }
  .layer { position: absolute; inset: 0; width: 1180px; height: 820px; pointer-events: none; }

  /* clouds */
  .cloud { position: absolute; height: 34px; border-radius: 40px; background: #fff; opacity: .92; animation: drift 38s ease-in-out infinite alternate; }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 54%; height: 150%; left: 14%; bottom: 30%; }
  .cloud::after { width: 36%; height: 120%; left: 50%; bottom: 36%; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(40px); } }

  /* sand ground */
  .ground {
    position: absolute; left: 0; right: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(160,110,50,.16) 0 1.4px, transparent 2px) 0 0 / 23px 19px,
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.35) 0 1.2px, transparent 1.8px) 0 0 / 31px 27px,
      linear-gradient(180deg, #f5dfb0 0%, var(--sand) 18%, var(--sand-deep) 100%);
  }
  .ground::before { /* soft horizon lip */
    content: ''; position: absolute; left: 0; right: 0; top: -6px; height: 12px;
    background: linear-gradient(180deg, transparent, rgba(245,223,176,.9) 50%, transparent);
  }

  /* ---------- buttons ---------- */
  .home {
    position: absolute; left: 24px; top: 22px; width: 72px; height: 72px; border-radius: 50%;
    background: #fff; display: grid; place-items: center; z-index: 5;
    box-shadow: 0 0 0 5px var(--crane), 0 0 0 7px var(--ink), 0 8px 14px rgba(20,60,90,.28);
  }

  /* ---------- picture crates ---------- */
  .crate {
    position: absolute; width: 166px; height: 166px; border-radius: 8px; z-index: 3;
    display: grid; place-items: center;
    background:
      linear-gradient(180deg, transparent 0 52px, rgba(150,96,40,.42) 52px 55px, transparent 55px 107px, rgba(150,96,40,.42) 107px 110px, transparent 110px),
      repeating-linear-gradient(90deg, rgba(190,130,60,.05) 0 2px, transparent 2px 23px),
      linear-gradient(180deg, #fcecc9, var(--pine));
    border: 3px solid #a66d32;
    box-shadow: 0 7px 0 #b88447, 0 7px 0 3px #8c5a28, 0 18px 24px rgba(90,60,20,.32);
  }
  .crate::after { /* steel corner brackets with bolts */
    content: ''; position: absolute; inset: -3px; border-radius: 8px; pointer-events: none;
    --b: #59606c;
    background:
      radial-gradient(circle, #c6ccd5 0 2.6px, transparent 3.2px) 9px 9px / 9px 9px no-repeat,
      radial-gradient(circle, #c6ccd5 0 2.6px, transparent 3.2px) calc(100% - 9px) 9px / 9px 9px no-repeat,
      radial-gradient(circle, #c6ccd5 0 2.6px, transparent 3.2px) 9px calc(100% - 9px) / 9px 9px no-repeat,
      radial-gradient(circle, #c6ccd5 0 2.6px, transparent 3.2px) calc(100% - 9px) calc(100% - 9px) / 9px 9px no-repeat,
      linear-gradient(var(--b), var(--b)) 0 0 / 30px 8px no-repeat,
      linear-gradient(var(--b), var(--b)) 0 0 / 8px 30px no-repeat,
      linear-gradient(var(--b), var(--b)) 100% 0 / 30px 8px no-repeat,
      linear-gradient(var(--b), var(--b)) 100% 0 / 8px 30px no-repeat,
      linear-gradient(var(--b), var(--b)) 0 100% / 30px 8px no-repeat,
      linear-gradient(var(--b), var(--b)) 0 100% / 8px 30px no-repeat,
      linear-gradient(var(--b), var(--b)) 100% 100% / 30px 8px no-repeat,
      linear-gradient(var(--b), var(--b)) 100% 100% / 8px 30px no-repeat;
  }
  .emoji { font-family: var(--emoji); line-height: 1; filter: drop-shadow(0 3px 2px rgba(80,50,10,.25)); }
  .crate .emoji { font-size: 90px; position: relative; z-index: 1; }

  /* ---------- word signs ---------- */
  .sign {
    position: absolute; z-index: 3;
    font: 400 48px/1 'Andika', sans-serif; color: var(--word);
    background: #fffdf6; padding: 14px 30px 18px;
    border: 10px solid var(--crane); border-radius: 12px;
    box-shadow: 0 0 0 3px var(--ink), 0 7px 0 3px #b9860a, 0 7px 0 6px var(--ink), 0 16px 22px rgba(90,60,20,.30);
  }
  .sign::before { /* bolts in the frame */
    content: ''; position: absolute; inset: -10px; border-radius: 12px; pointer-events: none;
    background:
      radial-gradient(circle, #8a6400 0 2.4px, transparent 3px) 2px 2px / 8px 8px no-repeat,
      radial-gradient(circle, #8a6400 0 2.4px, transparent 3px) calc(100% - 2px) 2px / 8px 8px no-repeat,
      radial-gradient(circle, #8a6400 0 2.4px, transparent 3px) 2px calc(100% - 2px) / 8px 8px no-repeat,
      radial-gradient(circle, #8a6400 0 2.4px, transparent 3px) calc(100% - 2px) calc(100% - 2px) / 8px 8px no-repeat;
  }
  .sign.lifted {
    z-index: 6;
    box-shadow: 0 0 0 3px var(--ink), 0 7px 0 3px #b9860a, 0 7px 0 6px var(--ink), 0 34px 34px rgba(80,50,10,.34), 0 12px 10px rgba(80,50,10,.18);
  }
  .touch { position: absolute; width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.45); box-shadow: 0 0 0 3px rgba(255,255,255,.7); z-index: 7; }

  /* ---------- conveyor belt ---------- */
  .belt { position: absolute; left: 0; right: 0; bottom: 0; height: 138px; z-index: 4; }
  .belt .edge { position: absolute; left: 0; right: 0; top: 0; height: 14px; background: repeating-linear-gradient(-45deg, var(--ink) 0 14px, var(--crane) 14px 28px); box-shadow: 0 -3px 0 #f6c94a inset; }
  .belt .surface {
    position: absolute; left: 0; right: 0; top: 14px; height: 94px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.12), transparent 18%, transparent 82%, rgba(0,0,0,.18)),
      repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 3px, transparent 3px 34px),
      #4f5662;
    animation: belt 6s linear infinite;
  }
  @keyframes belt { from { background-position: 0 0, 0 0, 0 0; } to { background-position: 0 0, 34px 0, 0 0; } }
  .belt .rollers {
    position: absolute; left: 0; right: 0; bottom: 0; height: 30px;
    background:
      radial-gradient(circle at 50% 50%, #e3e7ec 0 4px, #9aa3af 4.5px 11px, #6c7480 11.5px 12.5px, transparent 13px) 0 0 / 46px 30px,
      linear-gradient(180deg, #7d8692, #646c78);
  }
  .pair { position: absolute; top: 24px; display: flex; align-items: center; gap: 12px; }
  .mini-crate {
    width: 76px; height: 76px; border-radius: 6px; display: grid; place-items: center; position: relative;
    background: linear-gradient(180deg, transparent 0 24px, rgba(150,96,40,.4) 24px 26px, transparent 26px 49px, rgba(150,96,40,.4) 49px 51px, transparent 51px), linear-gradient(180deg, #fcecc9, var(--pine));
    border: 2px solid #a66d32; box-shadow: 0 4px 0 #8c5a28;
  }
  .mini-crate .emoji { font-size: 48px; }
  .mini-sign {
    font: 400 34px/1 'Andika', sans-serif; color: var(--word); background: #fffdf6;
    padding: 9px 18px 12px; border: 7px solid var(--crane); border-radius: 9px;
    box-shadow: 0 0 0 2px var(--ink), 0 4px 0 2px var(--ink);
  }

  /* ---------- top bar: collection truck ---------- */
  .badge {
    position: absolute; display: grid; place-items: center; border-radius: 50%;
    font: 700 28px/1 'Andika', sans-serif; color: var(--ink);
    background: #fff; box-shadow: 0 0 0 4px var(--ink), 0 5px 8px rgba(0,0,0,.25);
  }

  /* ---------- start screen ---------- */
  .title-sign {
    position: absolute; left: 400px; top: 196px; width: 380px; height: 106px; z-index: 3;
    display: grid; place-items: center; border-radius: 12px;
    background: var(--crane); box-shadow: 0 0 0 5px var(--ink), 0 14px 18px rgba(20,60,90,.25);
    font: 700 66px/1 var(--sign-font); color: var(--ink); letter-spacing: .5px;
    transform-origin: 50% -60px; animation: sway 6s ease-in-out infinite;
  }
  .title-sign::before { content: ''; position: absolute; inset: 9px; border: 3px solid rgba(46,43,40,.35); border-radius: 6px; }
  @keyframes sway { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
  .kid { position: absolute; width: 200px; text-align: center; z-index: 3; }
  .kid .face {
    width: 178px; height: 178px; margin: 0 auto; border-radius: 50%; background: #fffdf6; position: relative;
    display: grid; place-items: center; padding-top: 26px;
    box-shadow: 0 0 0 6px #fff, 0 0 0 9px rgba(46,43,40,.18), 0 16px 22px rgba(30,70,100,.28);
  }
  .kid .face .emoji { font-size: 98px; }
  .kid .hat { position: absolute; left: 50%; top: -48px; width: 168px; margin-left: -84px; filter: drop-shadow(0 5px 3px rgba(40,30,10,.25)); }
  .kid .name { margin-top: 26px; font: 400 42px/1 'Andika', sans-serif; color: var(--word); }
  .kid .count {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 5px 14px 6px 10px;
    border-radius: 20px; background: rgba(255,253,246,.85); box-shadow: 0 0 0 2px rgba(46,43,40,.25);
    font: 700 22px/1 'Andika', sans-serif; color: var(--ink);
  }
  .lock { position: absolute; right: 18px; bottom: 16px; width: 64px; height: 64px; display: grid; place-items: center; z-index: 5; opacity: .55; }

  /* ---------- reward ---------- */
  .go {
    position: absolute; left: 1036px; top: 380px; width: 124px; height: 350px; z-index: 4;
    border-radius: 22px; background: #3c424d; box-shadow: 0 0 0 5px var(--ink), 0 16px 24px rgba(40,30,10,.3);
  }
  .go .lamp { position: absolute; left: 14px; width: 96px; height: 96px; border-radius: 50%; box-shadow: inset 0 6px 10px rgba(0,0,0,.45); }
  .go .lamp.red { top: 16px; background: #6e3a36; }
  .go .lamp.amber { top: 126px; background: #75602c; }
  .go .lamp.green {
    top: 236px; background: radial-gradient(circle at 40% 35%, #8af0a8, #2fbf63 60%, #1f9a4c);
    box-shadow: 0 0 0 4px #1f2a24, 0 0 26px 8px rgba(80,230,130,.55);
    display: grid; place-items: center; animation: glow 2.4s ease-in-out infinite;
  }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 4px #1f2a24, 0 0 18px 4px rgba(80,230,130,.45); } 50% { box-shadow: 0 0 0 4px #1f2a24, 0 0 34px 14px rgba(80,230,130,.65); } }
  .go .visor { position: absolute; left: 10px; width: 104px; height: 22px; border-radius: 50px 50px 0 0; background: #2f343d; }
  .twinkle { animation: tw 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .twinkle.d2 { animation-delay: .8s; } .twinkle.d3 { animation-delay: 1.6s; }
  @keyframes tw { 0%,100% { opacity: .35; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.1); } }
  .bob { animation: bob 4s ease-in-out infinite; transform-box: fill-box; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
