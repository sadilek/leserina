<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leserina – Unter Wasser</title>
<style>
  @font-face { font-family: 'Andika'; src: url('fonts/andika-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Andika'; src: url('fonts/andika-latin-700-normal.woff2') format('woff2'); font-weight: 700; }

  :root {
    --ink: #15324a;
    --shell: #fffaf2;
    --deep: #0d5f7a;
    --coral: #f47b68;
    --sand: #f0d7a4;
    --lilac: #a996e4;
    --emoji: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
    --title: 'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #22252b; }
  body { padding: 34px 16px 60px; font-family: 'Avenir Next', 'Avenir', 'Helvetica Neue', sans-serif; }

  .stack { zoom: var(--s, 1); width: 1180px; margin: 0 auto; }

  /* page heading */
  .intro { margin: 0 0 30px; display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap; }
  .intro h1 {
    margin: 0; font: 700 46px/1.1 var(--title);
    background: linear-gradient(180deg, #b9f3ea 0%, #5fd0cb 55%, #2aa5b5 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    position: relative; padding-bottom: 12px;
  }
  .intro h1 svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 12px; }
  .intro p { margin: 0; color: #aeb9c4; font-size: 17px; line-height: 1.45; max-width: 64ch; }

  .caption { color: #8fa0ad; font: 600 15px/1 'Avenir Next', 'Avenir', sans-serif; letter-spacing: .04em; margin: 0 0 10px 4px; }
  .caption + .frame { margin-bottom: 28px; }

  /* ---------- frame + water ---------- */
  .frame {
    width: 1180px; height: 820px; overflow: hidden; position: relative; border-radius: 18px;
    background: linear-gradient(180deg, #a3ebe1 0%, #64d0cc 14%, #2fb0bd 40%, #1a92a9 66%, #127996 86%, #0e6a86 100%);
    isolation: isolate;
  }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .rays { mix-blend-mode: soft-light; opacity: .9; animation: sway 9s ease-in-out infinite alternate; transform-origin: 50% 0; }
  .rays2 { opacity: .35; }
  @keyframes sway { from { transform: skewX(-2deg); } to { transform: skewX(2.5deg); } }

  /* rising bubbles */
  .bub {
    position: absolute; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.75);
    background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.95) 0 14%, rgba(255,255,255,.18) 34%, rgba(255,255,255,.06) 70%);
    animation: rise var(--t, 10s) linear infinite; animation-delay: var(--d, 0s);
  }
  @keyframes rise {
    0% { transform: translate(0, 0); opacity: 0; }
    8% { opacity: 1; }
    50% { transform: translate(6px, -160px); }
    85% { opacity: .9; }
    100% { transform: translate(-4px, -330px); opacity: 0; }
  }

  .weed { position: absolute; bottom: 0; transform-origin: 50% 100%; animation: weed 6s ease-in-out infinite alternate; }
  @keyframes weed { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
  .sand { position: absolute; left: 0; bottom: 0; width: 1180px; }
  .deco { position: absolute; }

  /* ---------- picture bubbles ---------- */
  .pic {
    position: absolute; width: 168px; height: 168px; border-radius: 50%;
    display: grid; place-items: center;
    font: 90px/1 var(--emoji);
    background:
      radial-gradient(circle at 50% 54%, rgba(255,255,255,.97) 0 50%, rgba(238,252,252,.95) 66%, rgba(196,238,243,.93) 88%, rgba(170,226,236,.95) 100%);
    box-shadow:
      inset 0 0 0 3px rgba(255,255,255,.9),
      inset 0 0 0 7px rgba(255,214,236,.22),
      inset -12px -18px 26px rgba(56,166,188,.24),
      0 14px 22px rgba(3,52,72,.32);
  }
  .pic::before {
    content: ''; position: absolute; left: 26px; top: 20px; width: 46px; height: 20px; border-radius: 50%;
    background: linear-gradient(180deg, #fff, rgba(255,255,255,.4)); transform: rotate(-34deg);
  }
  .pic::after {
    content: ''; position: absolute; left: 22px; top: 50px; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.9);
  }
  .pic.sm { width: 90px; height: 90px; font-size: 52px; }
  .pic.sm::before { left: 14px; top: 11px; width: 24px; height: 11px; }
  .pic.sm::after { left: 11px; top: 27px; width: 6px; height: 6px; }

  /* ---------- word fish ---------- */
  .fish {
    position: absolute; display: flex; align-items: center;
    height: 84px; padding: 0 30px 3px 64px;
    font: 400 48px/1 'Andika', sans-serif; color: var(--ink);
    background: linear-gradient(180deg, #fffefb 0%, #fdf5ea 100%);
    border-radius: 46px 30px 30px 46px / 42px;
    box-shadow: inset 0 -6px 0 rgba(212,186,154,.45), inset 0 3px 0 #fff, 0 10px 16px rgba(3,52,72,.32);
  }
  .fish .tail { position: absolute; right: -40px; top: 50%; width: 46px; height: 72px; margin-top: -36px; overflow: visible; }
  .fish .fin  { position: absolute; left: 44%; top: -15px; width: 52px; height: 20px; overflow: visible; }
  .fish .eye {
    position: absolute; left: 22px; top: 26px; width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #fff 0 22%, #1d3348 26%);
  }
  .fish .cheek { position: absolute; left: 18px; top: 47px; width: 18px; height: 9px; border-radius: 50%; background: rgba(255,150,140,.35); }
  .fish .gill { position: absolute; left: 42px; top: 17px; width: 12px; height: 50px; border-right: 3px solid rgba(208,176,140,.55); border-radius: 0 50% 50% 0; }
  .fish.drag {
    transform: rotate(-5deg) scale(1.07); z-index: 5;
    box-shadow: inset 0 -6px 0 rgba(212,186,154,.45), inset 0 3px 0 #fff, 0 30px 34px rgba(2,38,56,.42);
  }
  .fish.sm { height: 60px; padding: 0 20px 2px 46px; font-size: 34px; border-radius: 33px 22px 22px 33px / 30px; }
  .fish.sm .tail { right: -30px; width: 34px; height: 52px; margin-top: -26px; }
  .fish.sm .fin { top: -11px; width: 38px; height: 15px; }
  .fish.sm .eye { left: 15px; top: 18px; width: 11px; height: 11px; }
  .fish.sm .cheek { left: 12px; top: 33px; width: 13px; height: 7px; }
  .fish.sm .gill { left: 30px; top: 12px; width: 9px; height: 36px; border-right-width: 2.5px; }

  /* ---------- top bar ---------- */
  .home {
    position: absolute; left: 24px; top: 20px; width: 76px; height: 76px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 55%, rgba(255,255,255,.95) 0 52%, rgba(208,244,246,.92) 100%);
    box-shadow: inset 0 0 0 3px #fff, inset -6px -9px 14px rgba(56,166,188,.25), 0 8px 14px rgba(3,52,72,.25);
  }
  .home svg { width: 40px; height: 40px; }
  .progress { position: absolute; left: 114px; top: 2px; width: 162px; height: 128px; filter: drop-shadow(0 6px 8px rgba(3,52,72,.28)); }
  .collection { position: absolute; right: 30px; top: 10px; width: 128px; height: 96px; filter: drop-shadow(0 6px 8px rgba(3,52,72,.28)); }
  .collection svg { width: 100%; height: 100%; }
  .badge {
    position: absolute; right: -10px; top: -4px; width: 50px; height: 50px; border-radius: 50%;
    display: grid; place-items: center; font: 700 29px/1 'Andika', sans-serif; color: var(--ink);
    background: radial-gradient(circle at 36% 30%, #fff 0 30%, #f5eef0 62%, #e2d6e2 100%);
    box-shadow: 0 0 0 3px #fff, 0 4px 8px rgba(40,30,90,.3);
  }

  /* ---------- bottom strip ---------- */
  .pair { position: absolute; display: flex; align-items: center; gap: 14px; }
  .pair > .pic, .pair > .fish { position: relative; }

  /* ---------- start ---------- */
  .title { position: absolute; left: 190px; top: 66px; width: 800px; height: 230px; overflow: visible; }
  .title text { font: 700 128px var(--title); letter-spacing: 2px; }
  .kid { position: absolute; top: 300px; width: 240px; display: flex; flex-direction: column; align-items: center; }
  .avatar {
    position: relative; width: 208px; height: 208px; border-radius: 50%; display: grid; place-items: center;
    font: 118px/1 var(--emoji);
    background: radial-gradient(circle at 50% 54%, rgba(255,255,255,.97) 0 52%, rgba(238,252,252,.95) 68%, rgba(190,236,242,.93) 100%);
    box-shadow: inset 0 0 0 4px rgba(255,255,255,.9), inset 0 0 0 9px rgba(255,214,236,.22), inset -14px -20px 30px rgba(56,166,188,.24), 0 16px 26px rgba(3,52,72,.32);
  }
  .avatar::before {
    content: ''; position: absolute; left: 32px; top: 26px; width: 56px; height: 24px; border-radius: 50%;
    background: linear-gradient(180deg, #fff, rgba(255,255,255,.4)); transform: rotate(-34deg);
  }
  .avatar::after { content: ''; position: absolute; left: 27px; top: 64px; width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.9); }
  .count {
    position: absolute; right: -8px; bottom: 4px; display: flex; align-items: center; gap: 4px;
    height: 46px; padding: 0 14px 0 6px; border-radius: 23px;
    background: #fffaf2; box-shadow: inset 0 -3px 0 rgba(212,186,154,.45), 0 5px 10px rgba(3,52,72,.3);
    font: 700 26px/1 'Andika', sans-serif; color: var(--ink);
  }
  .count svg { width: 44px; height: 35px; }
  .name {
    margin-top: 22px; padding: 6px 28px 10px; border-radius: 26px;
    font: 400 44px/1.05 'Andika', sans-serif; color: var(--ink);
    background: linear-gradient(180deg, #fffefb, #fdf5ea);
    box-shadow: inset 0 -5px 0 rgba(212,186,154,.45), 0 8px 14px rgba(3,52,72,.28);
  }
  .lock { position: absolute; right: 18px; bottom: 14px; width: 64px; height: 64px; display: grid; place-items: center; }
  .lock svg { width: 28px; height: 30px; }

  /* ---------- reward ---------- */
  .halo { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,250,220,.75) 0, rgba(255,246,210,.35) 35%, rgba(255,240,200,0) 68%); animation: pulse 3.5s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(.96); opacity: .85; } to { transform: scale(1.04); opacity: 1; } }
  .bigshell { position: absolute; left: 96px; top: 176px; width: 420px; height: 332px; filter: drop-shadow(0 18px 22px rgba(3,52,72,.35)); transform: rotate(-4deg); }
  .twinkle { position: absolute; animation: tw 2.4s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
  @keyframes tw { from { transform: scale(.75) rotate(0deg); opacity: .6; } to { transform: scale(1.1) rotate(20deg); opacity: 1; } }
  .chest { position: absolute; left: 614px; top: 150px; width: 500px; height: 365px; filter: drop-shadow(0 18px 22px rgba(30,20,80,.32)); }
  .chest > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .chest .item { position: absolute; width: 80px; height: 63px; filter: drop-shadow(0 4px 4px rgba(120,60,90,.28)); }
  .chest .badge { width: 82px; height: 82px; font-size: 48px; right: -8px; top: 8px; box-shadow: 0 0 0 4px #fff, 0 6px 12px rgba(40,30,90,.32); }
  .play {
    position: absolute; left: 520px; top: 600px; width: 140px; height: 140px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 40% 34%, #ffc2b2 0, #ff9a83 40%, #ef6f5c 100%);
    box-shadow: inset 0 0 0 5px rgba(255,255,255,.65), inset -10px -14px 22px rgba(170,50,40,.25), 0 16px 26px rgba(3,52,72,.38);
  }
  .play::before { content: ''; position: absolute; left: 30px; top: 22px; width: 40px; height: 17px; border-radius: 50%; background: rgba(255,255,255,.75); transform: rotate(-34deg); }
  .play svg { width: 64px; height: 64px; margin-left: 10px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
