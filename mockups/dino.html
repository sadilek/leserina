<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leserina: Dino-Tal</title>
<style>
@font-face { font-family: 'Andika'; src: url('fonts/andika-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Andika'; src: url('fonts/andika-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #22252b; color: #EADFD2; font-family: 'Avenir Next', 'Avenir', 'Helvetica Neue', sans-serif; padding: 26px 16px 60px; }
.stack { zoom: var(--s, 1); width: 1180px; margin: 0 auto; }
.page-head { display: flex; align-items: baseline; gap: 22px; margin: 0 0 6px; }
.page-head h1 { margin: 0; font: 700 44px/1 Rockwell, 'Rockwell Extra Bold', 'American Typewriter', Georgia, serif; color: #F7BE93; letter-spacing: .5px; }
.page-head h1 .dot { display: inline-block; width: 22px; height: 27px; margin-left: 8px; vertical-align: -2px; }
.page-head p { margin: 0; font-size: 17px; color: #BFB3A6; max-width: 70ch; }
.cap { margin: 30px 0 10px; font: 600 15px/1 'Avenir Next', Avenir, sans-serif; color: #A99D91; letter-spacing: .3px; }
.frame { width: 1180px; height: 820px; overflow: hidden; position: relative; border-radius: 18px; background: #FBD9B6; }
.frame > svg.bg, .frame > svg.edge { position: absolute; inset: 0; width: 1180px; height: 820px; pointer-events: none; }

/* ---------- top bar ---------- */
.topbar { position: absolute; left: 0; right: 0; top: 0; height: 110px; z-index: 5; }
.stone-btn { position: absolute; width: 78px; height: 78px; border: 0; padding: 0; border-radius: 47% 53% 50% 50% / 52% 48% 52% 48%;
  background: radial-gradient(circle at 36% 30%, #F5EFE4 0, #E4DACA 55%, #D2C5B1 100%);
  box-shadow: 0 6px 0 #B4A58E, 0 12px 18px rgba(90, 55, 30, .28), inset 0 2px 0 rgba(255,255,255,.7);
  display: grid; place-items: center; cursor: pointer; }
.home { left: 26px; top: 16px; }
.topbar .egg { position: absolute; left: 124px; top: 2px; }
.topbar .nestwrap { position: absolute; right: 22px; top: 10px; width: 150px; height: 90px; }
.badge { position: absolute; display: grid; place-items: center; border-radius: 50%; background: #FFD45C; color: #4A2F1C;
  font: 700 26px/1 'Andika', sans-serif; box-shadow: 0 3px 0 #D9A92C, 0 6px 10px rgba(90, 55, 30, .25); border: 3px solid #FFF3CC; }
.topbar .badge { right: -6px; top: -4px; width: 44px; height: 44px; }

/* ---------- cards ---------- */
.tablet { position: absolute; width: 162px; height: 158px; display: grid; place-items: center;
  border-radius: 44px 52px 40px 56px / 50px 42px 54px 44px;
  background:
    radial-gradient(circle at 22% 78%, rgba(160,140,110,.18) 0 3px, transparent 4px),
    radial-gradient(circle at 80% 22%, rgba(160,140,110,.16) 0 2.5px, transparent 3.5px),
    radial-gradient(circle at 72% 84%, rgba(160,140,110,.14) 0 4px, transparent 5px),
    radial-gradient(circle at 34% 26%, #F6F1E8 0, #E8E0D1 48%, #D6CAB5 100%);
  box-shadow: 0 7px 0 #B9AB94, 0 9px 0 #A6977F, 0 18px 24px rgba(74, 46, 24, .32), inset 0 3px 0 rgba(255,255,255,.75), inset 0 -6px 12px rgba(120, 95, 60, .12); }
.tablet span { font-size: 90px; line-height: 1; transform: translateY(-2px); }
.tablet.small { position: relative; width: 84px; height: 82px; border-radius: 24px 28px 22px 30px / 27px 22px 29px 24px;
  box-shadow: 0 4px 0 #B9AB94, 0 10px 12px rgba(74, 46, 24, .3), inset 0 2px 0 rgba(255,255,255,.75); }
.tablet.small span { font-size: 50px; }

.bone { position: absolute; height: 66px; padding: 0 30px; border-radius: 16px; z-index: 1;
  background: linear-gradient(#FFFBF1, #F5EAD2); color: #2D241C;
  font: 700 48px/66px 'Andika', sans-serif; letter-spacing: .5px;
  filter: drop-shadow(1.6px 0 0 #C6AD86) drop-shadow(-1.6px 0 0 #C6AD86) drop-shadow(0 1.6px 0 #C6AD86) drop-shadow(0 -1.6px 0 #C6AD86) drop-shadow(0 8px 9px rgba(74, 46, 24, .32)); }
.bone::before, .bone::after { content: ''; position: absolute; top: -11px; width: 44px; height: 88px; z-index: -1;
  background:
    radial-gradient(circle at 22px 21px, #FFFAEE 20px, transparent 21px),
    radial-gradient(circle at 22px 67px, #F6ECD6 20px, transparent 21px); }
.bone::before { left: -24px; }
.bone::after { right: -24px; }
.bone span { position: relative; display: block; transform: translateY(-1px); }
.bone.small { position: relative; height: 50px; padding: 0 20px; border-radius: 12px; font-size: 38px; line-height: 50px; margin-left: 30px;
  filter: drop-shadow(1.4px 0 0 #C6AD86) drop-shadow(-1.4px 0 0 #C6AD86) drop-shadow(0 1.4px 0 #C6AD86) drop-shadow(0 -1.4px 0 #C6AD86) drop-shadow(0 5px 6px rgba(74, 46, 24, .3)); }
.bone.small::before, .bone.small::after { top: -8px; width: 32px; height: 66px;
  background: radial-gradient(circle at 16px 15px, #FFFAEE 14.5px, transparent 15.5px), radial-gradient(circle at 16px 51px, #F6ECD6 14.5px, transparent 15.5px); }
.bone.small::before { left: -17px; }
.bone.small::after { right: -17px; }
.bone.drag { z-index: 4; transform: rotate(-4deg) scale(1.07);
  filter: drop-shadow(1.6px 0 0 #C6AD86) drop-shadow(-1.6px 0 0 #C6AD86) drop-shadow(0 1.6px 0 #C6AD86) drop-shadow(0 -1.6px 0 #C6AD86) drop-shadow(0 26px 22px rgba(60, 36, 18, .38)); }
.drag-trail { position: absolute; pointer-events: none; }

/* ---------- bottom ledge ---------- */
.ledge { position: absolute; left: 0; right: 0; bottom: 0; height: 138px; z-index: 3; }
.ledge-art { position: absolute; inset: 0; width: 100%; height: 100%; }
.ledge::before { content: ''; position: absolute; left: 0; right: 0; top: -14px; height: 14px; background: linear-gradient(transparent, rgba(70, 40, 20, .18)); }
.pair { position: absolute; top: 26px; display: flex; align-items: center; }

/* ---------- start ---------- */
.title { position: absolute; left: 0; right: 0; top: 118px; text-align: center; margin: 0;
  font: 700 106px/1 Rockwell, 'Rockwell Extra Bold', 'American Typewriter', Georgia, serif; color: #5B3A26; letter-spacing: 1px;
  text-shadow: 0 3px 0 #FFE9CF, 0 7px 0 #E8A983, 0 14px 22px rgba(120, 60, 30, .25); }
.kids { position: absolute; left: 0; right: 0; top: 300px; display: flex; justify-content: center; gap: 70px; z-index: 2; }
.kid { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; font: inherit; }
.kid-egg { position: relative; width: 210px; height: 252px; display: block; }
.kid-egg svg { display: block; }
.kid-emoji { position: absolute; left: 0; right: 0; top: 76px; text-align: center; font-size: 104px; line-height: 1; }
.kid-name { margin-top: 6px; font: 700 46px/1.1 'Andika', sans-serif; color: #2D241C; background: #FFF8EA; padding: 2px 26px 6px; border-radius: 30px;
  box-shadow: 0 4px 0 #D9C3A0, 0 8px 14px rgba(74, 46, 24, .2); }
.kid-count { margin-top: 12px; display: flex; align-items: center; gap: 6px; font: 700 26px/1 'Andika', sans-serif; color: #2F4A2A;
  background: rgba(255, 250, 238, .82); padding: 5px 14px 5px 10px; border-radius: 20px; }
.lock { position: absolute; right: 18px; bottom: 16px; width: 64px; height: 64px; border: 0; background: none; display: grid; place-items: center; opacity: .55; z-index: 3; }

/* ---------- reward ---------- */
.glow { position: absolute; inset: 0; background: radial-gradient(circle at 280px 450px, rgba(255, 246, 220, .75), rgba(255, 246, 220, 0) 380px); }
.hatch { position: absolute; left: 90px; top: 196px; z-index: 2; }
.bignest { position: absolute; left: 520px; top: 258px; z-index: 2; }
.bignest .badge { right: -26px; top: 120px; width: 92px; height: 92px; font-size: 56px; border-width: 5px; box-shadow: 0 5px 0 #D9A92C, 0 12px 18px rgba(90, 55, 30, .3); }
.next { position: absolute; right: 56px; bottom: 50px; width: 132px; height: 132px; border: 0; border-radius: 50%; z-index: 4;
  background: radial-gradient(circle at 38% 30%, #9FD58A, #6FAF5E 60%, #5D9B4E);
  box-shadow: 0 9px 0 #44783A, 0 20px 26px rgba(40, 60, 20, .35), inset 0 3px 0 rgba(255,255,255,.45);
  display: grid; place-items: center; cursor: pointer; }
.topbar.reward .home { left: 26px; }

@keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.8); } }
.spark { transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
.hatch .baby { transform-box: fill-box; transform-origin: 50% 100%; animation: wobble 3.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
