<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leserina – Weltraum</title>
<style>
@font-face { font-family: 'Andika'; src: url('fonts/andika-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Andika'; src: url('fonts/andika-latin-700-normal.woff2') format('woff2'); font-weight: 700; }

:root {
  --ink: #18203d;
  --space-0: #0d1434;
  --space-1: #1b1d52;
  --space-2: #3a2468;
  --cyan: #7fe9ff;
  --gold: #ffd347;
  --display: Futura, 'Avenir Next', 'Century Gothic', 'Trebuchet MS', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #22252b; padding: 26px 16px 60px; color: #e9ecf6; }
button { font: inherit; color: inherit; border: 0; padding: 0; background: none; cursor: pointer; }

.head { text-align: center; margin: 0 auto 6px; max-width: 900px; }
.head h1 { font: 700 46px/1.1 var(--display); letter-spacing: .02em; color: #ffe9a8; margin: 0;
  display: inline-flex; align-items: center; gap: 14px; text-shadow: 0 0 22px rgba(255,205,110,.35); }
.head h1 svg { flex: none; }
.head p { font: 500 17px/1.45 'Avenir Next', Avenir, 'Helvetica Neue', sans-serif; color: #b7bdd6; margin: 8px auto 0; max-width: 64ch; }

.stack { zoom: var(--s, 1); width: 1180px; margin: 0 auto; }
.caption { font: 500 22px/1 var(--display); color: #c9cde0; margin: 30px 0 12px 4px; display: flex; align-items: center; gap: 10px; }
.caption::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

.frame { width: 1180px; height: 820px; overflow: hidden; position: relative; border-radius: 18px;
  background:
    radial-gradient(ellipse 560px 360px at 28% 42%, rgba(168,96,226,.30), transparent 70%),
    radial-gradient(ellipse 420px 260px at 62% 18%, rgba(236,120,178,.16), transparent 70%),
    radial-gradient(ellipse 520px 300px at 78% 78%, rgba(70,150,230,.20), transparent 70%),
    linear-gradient(165deg, var(--space-0) 0%, var(--space-1) 48%, var(--space-2) 100%);
  box-shadow: 0 20px 50px rgba(0,0,0,.45); }
.frame > * { position: absolute; }
.stars { left: 0; top: 0; pointer-events: none; }
.planet, .moon { overflow: visible; display: block; }
.tw { animation: twinkle 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
.nebula { pointer-events: none; filter: blur(30px); border-radius: 50%; }

/* ---------- picture cards: portholes ---------- */
.porthole { width: 176px; height: 176px; border-radius: 50%; transform: rotate(var(--rot, 0deg));
  --rv: 9px;
  background:
    radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,.18) 61%, transparent 64%),
    conic-gradient(from 210deg, #8b96ab, #f6f8fc 18%, #b3bdcc 32%, #7d889e 50%, #c9d1dc 68%, #f2f5f9 82%, #8b96ab);
  box-shadow: 0 12px 26px rgba(4,6,28,.55), 0 0 0 2px rgba(40,48,80,.6), inset 0 2px 1px rgba(255,255,255,.7), inset 0 -3px 3px rgba(0,0,0,.25); }
.porthole .rv { position: absolute; width: var(--rv); height: var(--rv); margin: calc(var(--rv) / -2) 0 0 calc(var(--rv) / -2); border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffffff, #a8b2c2 55%, #6b7590);
  box-shadow: 0 1px 1px rgba(0,0,0,.35); }
.porthole .glass { position: absolute; inset: 10%; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 38% 32%, #ffffff 0%, #fbfcff 30%, var(--tint) 100%);
  box-shadow: 0 0 0 3px #5c6784, inset 0 5px 12px rgba(28,36,80,.35), inset 0 -2px 6px rgba(255,255,255,.8); }
.porthole .glass::after { content: ''; position: absolute; left: 14%; top: 10%; width: 52%; height: 52%; border-radius: 50%;
  border-top: 5px solid rgba(255,255,255,.95); border-left: 3px solid rgba(255,255,255,.5); transform: rotate(-12deg); filter: blur(.4px); }
.emo { font-size: 88px; line-height: 1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; position: relative; z-index: 1;
  transform: rotate(calc(var(--rot, 0deg) * -1)); }
.porthole.sm { position: relative; width: 86px; height: 86px; --rv: 5px; box-shadow: 0 4px 10px rgba(0,0,0,.45), 0 0 0 1.5px rgba(40,48,80,.6), inset 0 1px 1px rgba(255,255,255,.7); }
.porthole.sm .glass { box-shadow: 0 0 0 2px #5c6784, inset 0 3px 6px rgba(28,36,80,.35); }
.porthole.sm .glass::after { border-top-width: 3px; border-left-width: 2px; }
.porthole.sm .emo { font-size: 44px; }

/* ---------- word cards: control panel plates ---------- */
.plate { font: 400 48px/1 'Andika', sans-serif; color: var(--ink); white-space: nowrap;
  padding: 16px 34px 20px; border-radius: 18px; transform: rotate(var(--rot, 0deg));
  background:
    radial-gradient(circle at 11px 11px, #8d98ab 2.6px, #e8eef5 3.4px, transparent 4px),
    radial-gradient(circle at calc(100% - 11px) 11px, #8d98ab 2.6px, #e8eef5 3.4px, transparent 4px),
    radial-gradient(circle at 11px calc(100% - 11px), #8d98ab 2.6px, #e8eef5 3.4px, transparent 4px),
    radial-gradient(circle at calc(100% - 11px) calc(100% - 11px), #8d98ab 2.6px, #e8eef5 3.4px, transparent 4px),
    linear-gradient(180deg, #fdfeff 0%, #eef3f8 60%, #e1e8f1 100%);
  border: 3px solid #8ff0ff;
  box-shadow: 0 0 0 1.5px rgba(16,70,110,.55), 0 0 16px 3px rgba(95,225,255,.5), 0 10px 20px rgba(4,6,28,.5), inset 0 -4px 0 rgba(140,160,190,.35); }
.plate.drag { transform: rotate(var(--rot)) scale(1.07); z-index: 5;
  box-shadow: 0 0 0 1.5px rgba(16,70,110,.55), 0 0 30px 8px rgba(110,232,255,.75), 0 30px 44px rgba(2,4,24,.6), inset 0 -4px 0 rgba(140,160,190,.35); }
.plate.sm { position: relative; font-size: 36px; padding: 10px 22px 14px; border-radius: 14px; border-width: 2.5px;
  box-shadow: 0 0 0 1.5px rgba(16,70,110,.55), 0 0 10px 2px rgba(95,225,255,.45), 0 4px 10px rgba(0,0,0,.4), inset 0 -3px 0 rgba(140,160,190,.35); }

/* ---------- top bar ---------- */
.home { left: 26px; top: 22px; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 40% 35%, #34407c, #161c46 70%);
  box-shadow: 0 0 0 6px #b9c3d2, 0 0 0 7.5px #6d7891, inset 0 3px 8px rgba(0,0,0,.6), 0 8px 18px rgba(0,0,0,.45); }
.home svg { filter: drop-shadow(0 0 5px rgba(120,235,255,.8)); }
.progress { left: 122px; top: 4px; width: 108px; height: 108px; filter: drop-shadow(0 0 10px rgba(255,200,90,.35)); }
.collection { right: 30px; top: 8px; width: 96px; height: 108px; }
.collection .jar-sm { position: absolute; left: 4px; top: 2px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)) drop-shadow(0 0 10px rgba(120,160,255,.35)); }
.count { position: absolute; display: grid; place-items: center; border-radius: 50%; font: 700 26px/1 'Andika', sans-serif; color: var(--ink);
  background: radial-gradient(circle at 35% 30%, #fff4c0, #ffd347 55%, #f2a51e); box-shadow: 0 0 0 3px #1b1d52, 0 0 14px rgba(255,210,90,.6); }
.collection .count { right: -6px; top: -2px; width: 44px; height: 44px; }

/* ---------- docking bay ---------- */
.bay { left: 0; right: 0; bottom: 0; height: 138px;
  background:
    repeating-linear-gradient(90deg, transparent 0 233px, rgba(10,14,40,.55) 233px 235px, rgba(255,255,255,.12) 235px 236px),
    radial-gradient(circle, #9aa5bd 1.6px, transparent 2.4px) 8px 28px / 26px 100% repeat-x,
    radial-gradient(circle, #9aa5bd 1.6px, transparent 2.4px) 8px 126px / 26px 100% repeat-x,
    linear-gradient(180deg, #59648a 0%, #48527a 18%, #3b4468 60%, #2f3657 100%);
  box-shadow: 0 -6px 18px rgba(0,0,0,.45); }
.bay::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 14px;
  background: linear-gradient(180deg, #c3cbd8, #8e98ae 55%, #5e6888); box-shadow: 0 2px 0 rgba(10,14,40,.5); }
.bay::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
  background: repeating-linear-gradient(135deg, #2a3150 0 14px, #343c5f 14px 28px); opacity: .8; }
.lamp { position: absolute; top: 4px; width: 7px; height: 7px; border-radius: 50%; z-index: 2; }
.lamp.cool { background: #b7f6ff; box-shadow: 0 0 6px 2px rgba(127,233,255,.85); }
.lamp.warm { background: #fff0b0; box-shadow: 0 0 6px 2px rgba(255,205,90,.85); }
.lamp.blink { animation: blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
.berth { position: absolute; top: 26px; height: 100px; display: flex; align-items: center; gap: 14px; padding: 0 22px 0 8px;
  border-radius: 54px 20px 20px 54px;
  background: linear-gradient(180deg, #232948, #2d3456);
  box-shadow: inset 0 4px 10px rgba(0,0,0,.6), inset 0 -1px 0 rgba(255,255,255,.12), 0 1px 0 rgba(255,255,255,.14); }
.berth .dock-led { position: absolute; right: 9px; top: 9px; width: 9px; height: 9px; border-radius: 50%;
  background: #b6ffd9; box-shadow: 0 0 8px 2px rgba(80,240,160,.8); }
.berth .plate { transform: none; }
.berth.empty { width: 120px; padding: 0; justify-content: center; border-radius: 20px;
  background: linear-gradient(180deg, #2a3050, #313859); }
.berth.empty::before { content: ''; width: 64px; height: 64px; border-radius: 50%; border: 3px dashed rgba(143,240,255,.35); }

.trail { left: 0; top: 0; pointer-events: none; }

/* ---------- start ---------- */
.title { left: 0; right: 0; top: 70px; height: 220px; display: grid; place-items: center; }
.title h2 { position: relative; z-index: 2; margin: 0; font: 700 112px/1 var(--display); letter-spacing: .02em; color: #fff0c6;
  text-shadow: 0 0 26px rgba(255,205,110,.45), 0 4px 0 rgba(90,50,140,.6); }
.title svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.title .ring-front { z-index: 3; }
.kids { left: 0; right: 0; top: 318px; display: flex; justify-content: center; gap: 70px; }
.astro { position: relative; width: 236px; display: flex; flex-direction: column; align-items: center; }
.helmet { position: relative; width: 224px; height: 224px; border-radius: 50%; z-index: 2;
  background: radial-gradient(circle at 34% 26%, #ffffff 0%, #eef2f8 40%, #c3cbda 80%, #9aa4ba 100%);
  box-shadow: 0 14px 30px rgba(3,5,30,.55), inset 0 -6px 14px rgba(60,70,110,.35); }
.visor { position: absolute; left: 24px; right: 24px; top: 34px; bottom: 30px; border-radius: 48% 48% 44% 44% / 52% 52% 48% 48%;
  display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(ellipse at 42% 36%, #ffffff 0%, #f3f7ff 30%, var(--tint) 100%);
  box-shadow: 0 0 0 6px #f0c45c, 0 0 0 8px #b98a2a, inset 0 6px 14px rgba(30,40,90,.35); }
.visor::after { content: ''; position: absolute; left: 12%; top: 8%; width: 46%; height: 38%; border-radius: 50%;
  border-top: 7px solid rgba(255,255,255,.95); border-left: 4px solid rgba(255,255,255,.6); transform: rotate(-16deg); }
.visor .emo { font-size: 104px; transform: translateY(6px); }
.ear { position: absolute; top: 84px; width: 22px; height: 58px; border-radius: 10px;
  background: linear-gradient(180deg, #e3e8f0, #a8b2c5); box-shadow: 0 2px 4px rgba(0,0,0,.35); }
.ear.l { left: -12px; } .ear.r { right: -12px; }
.ear::after { content: ''; position: absolute; left: 6px; top: 22px; width: 10px; height: 10px; border-radius: 50%; background: #b7f6ff; box-shadow: 0 0 8px 2px rgba(127,233,255,.8); }
.lamp-top { position: absolute; left: 50%; top: -10px; width: 34px; height: 20px; margin-left: -17px; border-radius: 10px 10px 4px 4px;
  background: linear-gradient(180deg, #fff6c8, #ffd347); box-shadow: 0 0 14px 4px rgba(255,210,90,.55); }
.collar { width: 150px; height: 30px; margin-top: -14px; border-radius: 0 0 50% 50% / 0 0 100% 100%; z-index: 1; position: relative;
  background: linear-gradient(180deg, #7b86a0, #c9d1de 45%, #8994ad); box-shadow: 0 6px 12px rgba(0,0,0,.4); }
.collar::after { content: ''; position: absolute; left: 30px; right: 30px; top: 12px; height: 5px; border-radius: 3px;
  background: repeating-linear-gradient(90deg, #b7f6ff 0 8px, transparent 8px 14px); filter: drop-shadow(0 0 3px rgba(127,233,255,.9)); }
.astro .plate.name { position: relative; margin-top: 18px; font-size: 40px; padding: 10px 28px 14px; }
.countstar { position: absolute; right: -8px; top: -4px; width: 62px; height: 62px; filter: drop-shadow(0 0 8px rgba(255,205,90,.6)) drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
.countstar svg { position: absolute; inset: 0; }
.countstar b { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 7px; font: 700 23px/1 'Andika', sans-serif; color: var(--ink); }
.lock { right: 18px; bottom: 16px; width: 64px; height: 64px; display: grid; place-items: center; opacity: .42; }

/* ---------- reward ---------- */
.bigstar { left: 150px; top: 196px; width: 360px; height: 360px; }
.bigstar .rays { position: absolute; inset: -110px; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255,226,140,.22) 0 7deg, transparent 7deg 22deg);
  -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%); mask: radial-gradient(circle, #000 20%, transparent 68%);
  animation: spin 40s linear infinite; }
.bigstar .glow { position: absolute; inset: -40px; border-radius: 50%; background: radial-gradient(circle, rgba(255,214,110,.55), rgba(255,214,110,0) 66%); }
.bigstar svg { position: absolute; inset: 0; filter: drop-shadow(0 0 20px rgba(255,200,80,.75)); }
@keyframes spin { to { transform: rotate(360deg); } }
.rtrail { left: 0; top: 0; pointer-events: none; }
.jarwrap { left: 724px; top: 150px; width: 352px; height: 470px; }
.jarwrap .jar-big { position: absolute; left: 0; top: 60px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.5)) drop-shadow(0 0 24px rgba(120,160,255,.35)); }
.jarwrap .lid { position: absolute; left: 214px; top: 20px; transform: rotate(28deg); filter: drop-shadow(0 8px 12px rgba(0,0,0,.45)); }
.jarwrap .count { right: -4px; top: 104px; width: 84px; height: 84px; font-size: 50px; box-shadow: 0 0 0 5px #1b1d52, 0 0 24px rgba(255,210,90,.75); }
.next { left: 520px; top: 616px; width: 140px; height: 140px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 38% 32%, #c9fbff 0%, #5fdcf5 38%, #149ec9 100%);
  box-shadow: 0 0 0 10px #b9c3d2, 0 0 0 12px #6d7891, 0 0 34px 14px rgba(110,230,255,.45), 0 16px 26px rgba(0,0,0,.5), inset 0 -8px 14px rgba(0,60,110,.4);
  animation: bob 3s ease-in-out infinite; }
.next svg { margin-left: 10px; filter: drop-shadow(0 3px 2px rgba(0,50,90,.45)); }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

@media (prefers-reduced-motion: reduce) { .tw, .lamp.blink, .bigstar .rays, .next { animation: none; } }
</style>
</head>

<header class="head">
  <h1><svg width="54" height="40" viewBox="0 0 54 40" aria-hidden="true"><ellipse cx="27" cy="22" rx="25" ry="7" fill="none" stroke="#ffe0a0" stroke-opacity=".55" stroke-width="3" transform="rotate(-14 27 22)"/><circle cx="27" cy="20" r="12" fill="url(#planetGrad)"/><path d="M4 26 Q27 38 50 16" fill="none" stroke="#ffe7c2" stroke-width="3" stroke-linecap="round"/></svg>Weltraum</h1>
  <p>A trip through space: pictures sit in round portholes, words are glowing control-panel plates, and every finished round puts one more star into a jar of night sky.</p>
