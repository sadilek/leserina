# Checks the sync worker on changes under worker/. Deploying stays manual (README).
name: Worker

on:
  push:
    paths: ['worker/**']
  pull_request:
    paths: ['worker/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
